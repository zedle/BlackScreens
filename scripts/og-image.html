<!doctype html>
<!--
  Source for docs/assets/og.png, the link preview card.

  Render it with:
    pwsh scripts/make-og-image.ps1

  which drives headless Chrome at 1200x630, the size Open Graph and Twitter cards expect.
  Everything is vector and uses the same palette as the site, so the card stays legible when a
  chat client shrinks it to a thumbnail.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  :root {
    --bg: #0d0f14;
    --surface: #1a1d25;
    --line: #3a4150;
    --text: #e7eaf1;
    --muted: #98a1b2;
    --accent: #4c8dff;
  }

  * { box-sizing: border-box; margin: 0; }

  html, body {
    width: 1200px;
    height: 630px;
    overflow: hidden;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif;
    display: flex;
    align-items: center;
    position: relative;
  }

  /* Accent glow, kept well away from the text so nothing washes out. */
  .glow {
    position: absolute;
    width: 900px;
    height: 900px;
    right: -240px;
    top: -300px;
    background: radial-gradient(closest-side, rgba(76, 141, 255, 0.20), transparent);
  }

  .edge {
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    width: 10px;
    background: linear-gradient(180deg, var(--accent), #8b5cf6 55%, #ec4899);
  }

  .copy {
    position: relative;
    padding: 0 0 0 82px;
    width: 620px;
  }

  .mark {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 26px;
  }

  .mark svg { width: 44px; height: 30px; }

  .mark span {
    font-size: 26px;
    font-weight: 600;
    letter-spacing: -0.01em;
  }

  h1 {
    font-size: 62px;
    line-height: 1.06;
    letter-spacing: -0.03em;
    font-weight: 700;
    margin-bottom: 24px;
  }

  h1 em {
    font-style: normal;
    color: var(--accent);
  }

  p {
    font-size: 23px;
    line-height: 1.45;
    color: var(--muted);
    max-width: 30ch;
  }

  .tags {
    display: flex;
    gap: 10px;
    margin-top: 34px;
  }

  .tag {
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 7px 16px;
    font-size: 16px;
    color: var(--muted);
    background: rgba(26, 29, 37, 0.7);
  }

  .art {
    position: relative;
    flex: 1;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .art svg { width: 470px; }
</style>
</head>
<body>

<div class="edge"></div>
<div class="glow"></div>

<div class="copy">
  <div class="mark">
    <svg viewBox="0 0 24 16" fill="none" stroke="#e7eaf1" stroke-width="1.4"
         stroke-linecap="round" stroke-linejoin="round">
      <rect x="0.75" y="1.75" width="8" height="10" rx="1.2"/>
      <rect x="10.25" y="0.75" width="12.5" height="12" rx="1.2" fill="#4c8dff" stroke="#4c8dff"/>
      <path d="M4.75 11.75v2.5M2.5 14.25h4.5M16.5 12.75v2.5M14 15.25h5"/>
    </svg>
    <span>BlackScreens</span>
  </div>

  <h1>Black out the screens you are <em>not</em> gaming on.</h1>

  <p>The game keeps its monitor. Everything else goes dark until you alt tab back.</p>

  <div class="tags">
    <div class="tag">Windows</div>
    <div class="tag">Free</div>
    <div class="tag">Open source</div>
  </div>
</div>

<div class="art">
  <svg viewBox="0 0 420 250" fill="none">
    <defs>
      <linearGradient id="game" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#4c8dff"/>
        <stop offset="55%" stop-color="#8b5cf6"/>
        <stop offset="100%" stop-color="#ec4899"/>
      </linearGradient>
    </defs>

    <g stroke="#3a4150" stroke-width="2.4" stroke-linecap="round">
      <rect x="6" y="66" width="112" height="70" rx="5" fill="#05070b"/>
      <path d="M62 136v15M46 151h32"/>

      <rect x="300" y="66" width="112" height="70" rx="5" fill="#05070b"/>
      <path d="M356 136v15M340 151h32"/>
    </g>

    <g stroke="#4c8dff" stroke-width="2.8" stroke-linecap="round">
      <rect x="128" y="42" width="164" height="102" rx="6" fill="#05070b"/>
      <rect x="133" y="47" width="154" height="92" rx="3" fill="url(#game)" stroke="none"/>
      <path d="M210 144v18M186 162h48"/>
    </g>

    <g fill="#98a1b2" font-family="Segoe UI, sans-serif" font-size="13"
       font-weight="600" letter-spacing="1.4" text-anchor="middle">
      <text x="62" y="188">BLACK</text>
      <text x="210" y="188">GAME</text>
      <text x="356" y="188">BLACK</text>
    </g>
  </svg>
</div>

</body>
</html>
