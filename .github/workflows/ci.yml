name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore BlackScreens.slnx

      - name: Build
        run: dotnet build BlackScreens.slnx -c Release --no-restore --nologo

      - name: Test
        run: dotnet test BlackScreens.slnx -c Release --no-build --nologo

      # Catches a broken installer script long before a release tag.
      - name: Ensure NSIS
        shell: pwsh
        run: |
          $nsis = "${env:ProgramFiles(x86)}\NSIS"
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue) -and
              -not (Test-Path "$nsis\makensis.exe")) {
            choco install nsis -y --no-progress
          }
          $nsis >> $env:GITHUB_PATH

      - name: Publish and build the installer
        shell: pwsh
        run: ./scripts/publish.ps1
