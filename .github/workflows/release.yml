name: Release

# Releasing is two steps:
#
#   1. git tag v1.2.3 && git push origin v1.2.3
#   2. read the draft release it produces, edit the notes, press Publish
#
# The tag drives the version stamped into the binaries, the installer and the release name, so
# nothing in the repository has to be edited to cut a release.
#
# The build always leaves a draft, with the artifacts already attached. That way the notes get read
# before anyone sees them, and a tag pushed by mistake, or moved, only produces another draft
# rather than changing what is published. Drafts are invisible to the releases API, so the website
# and the updater in the app see nothing until the release is published, and when it is, it is
# already complete with its downloads. Publishing has to be the last step for that reason: an
# `on: release` trigger would have to build after publishing, leaving the release live and empty
# for as long as the build takes.
#
# Signing is optional. When the SignPath secrets are present, the app exe is signed first, the
# installer is built around that signed exe, and the installer is signed in turn. Without the
# secrets the release still happens, labelled as unsigned.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build, for example 1.2.3'
        required: true
      draft:
        description: 'Leave the release as a draft. Tag pushes always do.'
        type: boolean
        default: true

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Work out the version
        id: version
        shell: pwsh
        run: |
          $version = '${{ inputs.version }}'
          if (-not $version) { $version = '${{ github.ref_name }}' -replace '^v', '' }
          if ($version -notmatch '^\d+\.\d+\.\d+') {
            throw "Tag '${{ github.ref_name }}' does not look like v1.2.3."
          }
          "value=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Building BlackScreens $version"

      # Once per architecture. The artifacts land side by side under artifacts\ with names that
      # say which is which, and the installers are built later, after signing.
      - name: Build and publish
        shell: pwsh
        run: |
          ./scripts/publish.ps1 -Version '${{ steps.version.outputs.value }}' -Runtime win-x64 -NoInstaller
          ./scripts/publish.ps1 -Version '${{ steps.version.outputs.value }}' -Runtime win-arm64 -NoInstaller

      - name: Check for SignPath configuration
        id: signing
        shell: pwsh
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
        run: |
          $configured = -not [string]::IsNullOrWhiteSpace($env:SIGNPATH_API_TOKEN) `
            -and -not [string]::IsNullOrWhiteSpace($env:SIGNPATH_ORGANIZATION_ID)
          "configured=$($configured.ToString().ToLower())" >> $env:GITHUB_OUTPUT
          if (-not $configured) {
            Write-Host '::warning::SignPath is not configured. This release will be unsigned.'
          }

      # --- app signing -----------------------------------------------------

      - name: Upload unsigned app
        id: unsigned-app
        uses: actions/upload-artifact@v4
        with:
          name: blackscreens-app-unsigned
          path: artifacts/*
          if-no-files-found: error

      - name: Sign the app
        if: steps.signing.outputs.configured == 'true'
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.unsigned-app.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed-app

      - name: Take the signed app
        if: steps.signing.outputs.configured == 'true'
        shell: pwsh
        run: |
          Get-ChildItem signed-app -File -Recurse | Copy-Item -Destination artifacts -Force
          Get-ChildItem artifacts -Filter *.exe | ForEach-Object {
            $status = (Get-AuthenticodeSignature $_.FullName).Status
            "$($_.Name): $status"
            if ($status -ne 'Valid') { throw "$($_.Name) is not validly signed." }
          }

      # --- installer -------------------------------------------------------

      - name: Ensure NSIS
        shell: pwsh
        run: |
          $nsis = "${env:ProgramFiles(x86)}\NSIS"
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue) -and
              -not (Test-Path "$nsis\makensis.exe")) {
            choco install nsis -y --no-progress
          }
          $nsis >> $env:GITHUB_PATH

      - name: Build the installers
        shell: pwsh
        run: |
          foreach ($runtime in 'win-x64', 'win-arm64') {
            $exe = "artifacts/BlackScreens-${{ steps.version.outputs.value }}-$runtime.exe"
            ./scripts/build-installer.ps1 -SourceExe $exe -Version '${{ steps.version.outputs.value }}' -Runtime $runtime
          }

      - name: Upload unsigned installer
        id: unsigned-installer
        if: steps.signing.outputs.configured == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: blackscreens-installer-unsigned
          path: artifacts/*setup*.exe
          if-no-files-found: error

      - name: Sign the installer
        if: steps.signing.outputs.configured == 'true'
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.unsigned-installer.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed-installer

      - name: Take the signed installers
        if: steps.signing.outputs.configured == 'true'
        shell: pwsh
        run: |
          Get-ChildItem signed-installer -File -Recurse | Copy-Item -Destination artifacts -Force
          $setups = Get-ChildItem artifacts -Filter *setup*.exe
          if ($setups.Count -ne 2) { throw "Expected two installers, found $($setups.Count)." }
          foreach ($setup in $setups) {
            $status = (Get-AuthenticodeSignature $setup.FullName).Status
            "$($setup.Name): $status"
            if ($status -ne 'Valid') { throw "$($setup.Name) is not validly signed." }
          }

      # --- checks before anything is published -----------------------------

      - name: Smoke test the published app
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.value }}'

          # An Arm64 binary cannot be run on this x64 runner, but its version resource reads fine,
          # and so does the machine type in its PE header, which is what proves it really is Arm64
          # rather than an x64 build under another name.
          $expected = @{ 'win-x64' = 0x8664; 'win-arm64' = 0xAA64 }
          foreach ($runtime in 'win-x64', 'win-arm64') {
            $exe = "artifacts/BlackScreens-$version-$runtime.exe"
            $reported = (Get-Item $exe).VersionInfo.ProductVersion -replace '\+.*$', ''
            if ($reported -ne $version) {
              throw "$exe reports $reported but the tag says $version."
            }

            $stream = [System.IO.File]::OpenRead((Resolve-Path $exe))
            try {
              $reader = New-Object System.IO.BinaryReader $stream
              $stream.Position = 0x3C
              $stream.Position = $reader.ReadInt32()
              [void]$reader.ReadUInt32()
              $machine = $reader.ReadUInt16()
            }
            finally { $stream.Dispose() }

            "$runtime reports version $reported, machine 0x{0:X}" -f $machine
            if ($machine -ne $expected[$runtime]) {
              throw ("{0} has machine 0x{1:X}, expected 0x{2:X}." -f $exe, $machine, $expected[$runtime])
            }
          }

          foreach ($name in @(
            "BlackScreens-$version-win-x64.exe",
            "BlackScreens-$version-win-x64-runtime.zip",
            "BlackScreens-$version-setup.exe",
            "BlackScreens-$version-win-arm64.exe",
            "BlackScreens-$version-win-arm64-runtime.zip",
            "BlackScreens-$version-setup-arm64.exe")) {
            if (-not (Test-Path "artifacts/$name")) { throw "Missing artifact $name" }
          }

      # --- release ---------------------------------------------------------

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.value }}
          name: BlackScreens ${{ steps.version.outputs.value }}
          # A tag push is always a draft. A manual run can publish outright if it has to.
          draft: ${{ github.event_name != 'workflow_dispatch' || inputs.draft }}
          generate_release_notes: true
          files: artifacts/*
          body: |
            Builds are provided for x64 and for Arm64. Take the Arm64 ones on a Snapdragon or other
            Arm based PC, and the x64 ones everywhere else.

            `BlackScreens-*-setup.exe` installs to your user profile with no admin prompt.
            `BlackScreens-*-win-x64.exe` is the same app as a single portable file.
            `BlackScreens-*-runtime.zip` is a much smaller download that needs the .NET 10 Desktop Runtime.

            ${{ steps.signing.outputs.configured == 'true'
              && 'Free code signing provided by SignPath.io, certificate by SignPath Foundation.'
              || 'These binaries are NOT code signed. Windows SmartScreen will warn on first run.' }}
